<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeScan AI</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;margin:0;color:#111827}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 22px #00000012}h1{margin:0 0 5px}.sub,.status,.note{color:#6b7280}label{display:block;font-weight:600;margin:13px 0 7px}select,input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #d1d5db;font-size:16px;background:#fff;box-sizing:border-box}button{margin-top:14px;background:#111827;color:#fff;border:0;font-weight:700}button:disabled{opacity:.5}img{width:100%;border-radius:14px;margin-top:12px;display:none}.result{display:none}.signal{font-size:30px;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f3f4f6;padding:12px;border-radius:12px}.metric small{display:block;color:#6b7280;margin-bottom:4px}.note{font-size:13px;line-height:1.45}</style></head>
<body><div class="wrap"><div class="card"><h1>TradeScan AI</h1><div class="sub">MT5 Screenshot → Trade Plan</div>
<label>Market</label><select id="market"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option></select>
<label>Timeframe</label><select id="tf"><option>M5</option><option>M15</option><option>H1</option></select>
<label>MT5 screenshot</label><input id="file" type="file" accept="image/*"><img id="preview"><button id="go">ANALYSE CHART</button><div id="status" class="status"></div></div>
<div id="res" class="card result"><div id="sig" class="signal"></div><div class="grid">
<div class="metric"><small>Entry</small><b id="entry">—</b></div><div class="metric"><small>Stop Loss</small><b id="sl">—</b></div>
<div class="metric"><small>TP1</small><b id="tp1">—</b></div><div class="metric"><small>TP2</small><b id="tp2">—</b></div>
<div class="metric"><small>Risk : Reward</small><b id="rr">—</b></div><div class="metric"><small>Setup strength</small><b id="strength">—</b></div></div>
<p><b>Reason:</b> <span id="reason">—</span></p><p><b>Invalidation:</b> <span id="inv">—</span></p><button id="copy">COPY TRADE DETAILS</button></div>
<div class="card note">Analysis only. TradeScan AI does not place trades. Verify all levels on MT5 before acting.</div></div>
<script>
const f=document.getElementById('file'),p=document.getElementById('preview');f.onchange=()=>{if(f.files[0]){p.src=URL.createObjectURL(f.files[0]);p.style.display='block'}};
go.onclick=async()=>{if(!f.files[0]){status.textContent='Please choose an MT5 screenshot first.';return}go.disabled=true;status.textContent='Analysing chart…';let d=new FormData();d.append('image',f.files[0]);d.append('market',market.value);d.append('timeframe',tf.value);try{let r=await fetch('/api/analyse',{method:'POST',body:d}),x=await r.json();if(!r.ok)throw Error(x.error||'Analysis failed');res.style.display='block';sig.textContent=x.signal||'WAIT';entry.textContent=x.entry??'—';sl.textContent=x.stop_loss??'—';tp1.textContent=x.tp1??'—';tp2.textContent=x.tp2??'—';rr.textContent=x.risk_reward??'—';strength.textContent=x.setup_strength??'—';reason.textContent=x.reason??'—';inv.textContent=x.invalidation??'—';status.textContent='Analysis complete.'}catch(e){status.textContent=e.message}finally{go.disabled=false}};
copy.onclick=async()=>{await navigator.clipboard.writeText(`TradeScan AI\nSignal: ${sig.textContent}\nEntry: ${entry.textContent}\nSL: ${sl.textContent}\nTP1: ${tp1.textContent}\nTP2: ${tp2.textContent}\nR:R: ${rr.textContent}`);status.textContent='Trade details copied.'};
</script></body></html>
